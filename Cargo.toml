[package]
name = "rustub"
version = "0.1.0"
edition = "2024"
authors = ["Artemiy Pospelov <artem.pospelov2018@yandex.ru>"]
description = "Rust Simple Tiny Understanding Blockchain - Educational Project"
license = "MIT"

[dependencies]
# Core
sha2 = "0.10"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }

# Logging & Metrics
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
metrics = "0.22"
metrics-util = "0.15"
metrics-observer-json = "0.1.1"  # Simple JSON exporter for learning

# Optional: for future TUI
# ratatui = "0.24"
# crossterm = "0.27"
