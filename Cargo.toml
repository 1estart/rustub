[package]
name = "rustub"
version = "0.1.0"
edition = "2024"
authors = ["Artemiy Pospelov <artem.pospelov2018@yandex.ru>"]
description = "Rust Simple Tiny Understanding Blockchain - Educational Project"
license = "MIT"

[dependencies]
# Cryptography
sha2 = "0.10"
ed25519-dalek = "2.0"
rand = "0.8"
hex = "0.4"

# Serialization (JSON)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async and network
tokio = { version = "1.0", features = ["full"] }

# Interfaces
clap = { version = "4.0", features = ["derive"] }
ratatui = "0.24"
crossterm = "0.27"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = true
codegen-units = 1
